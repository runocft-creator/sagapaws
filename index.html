<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saga Paws | Canada Pet Savings</title>
    <style>
        :root { --primary-color: #4CAF50; --blue-link: #007bff; }
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: url('bg.jpg') no-repeat center center fixed; background-size: cover; font-size: 15px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(220, 240, 220, 0.85); z-index: 1; }
        
        .lang-bar { position: relative; z-index: 100; width: 100%; background: rgba(255, 255, 255, 0.95); padding: 8px 5px; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .lang-btn { text-decoration: none; color: #444; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #adc6ad; background: #fff; cursor: pointer; }
        
        .card { position: relative; z-index: 2; background: rgba(255, 255, 255, 0.95); width: 98%; max-width: 850px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 5px 40px 25px; text-align: center; margin: 10px 0; }
        h1 { font-size: 2.2rem; margin: 10px 0 5px; color: #1a1a1a; }
        .subtitle { font-size: 1.1rem; margin-bottom: 15px; color: #444; }

        .promo-box { border: 2px solid #ff4d4f; border-radius: 15px; padding: 12px; margin: 15px 0; background: #fff1f0; }
        .promo-title { color: #ff4d4f; font-weight: 800; font-size: 1.3rem; }
        
        .step-list { text-align: left; margin: 20px 0; padding: 0; font-size: 1.05rem; color: #333; line-height: 1.6; }
        .step-item { margin-bottom: 12px; padding-left: 35px; position: relative; }
        .step-item::before { content: "✅"; position: absolute; left: 0; }
        
        .inline-link { color: var(--blue-link); text-decoration: underline; font-weight: bold; cursor: pointer; }

        .btn { display: block; color: white; text-decoration: none; padding: 16px; border-radius: 18px; font-weight: bold; font-size: 1.25rem; margin-bottom: 12px; transition: 0.3s; }
        .btn-primary { background: #52c41a; }
        .btn-blue { background: #1890ff; }
        .btn-orange { background: #ff9800; } /* 新增：购物指引按钮颜色 */
        .btn:hover { transform: scale(1.01); opacity: 0.95; }
        #google_translate_element { display: none; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="lang-bar">
        <button onclick="changeLanguage('en')" class="lang-btn">English</button>
        <button onclick="changeLanguage('fr')" class="lang-btn">Français</button>
        <button onclick="changeLanguage('zh-CN')" class="lang-btn">中文(普)</button>
        <button onclick="changeLanguage('zh-TW')" class="lang-btn">中文(粤)</button>
        <button onclick="changeLanguage('pa')" class="lang-btn">ਪੰਜਾਬੀ</button>
        <button onclick="changeLanguage('es')" class="lang-btn">Español</button>
        <button onclick="changeLanguage('ar')" class="lang-btn">العربية</button>
        <button onclick="changeLanguage('tl')" class="lang-btn">Tagalog</button>
        <button onclick="changeLanguage('ko')" class="lang-btn">한국어</button>
        <button onclick="changeLanguage('vi')" class="lang-btn">Tiếng Việt</button>
        <div id="google_translate_element"></div>
    </div>

    <div class="card">
        <h1>Saga Paws</h1>
        <p class="subtitle">多伦多养宠“套利”省钱全攻略 🐾</p>
        
        <div class="promo-box">
            <div class="promo-title">🎁 限时福利：买 $40 返 $40</div>
            <p style="margin: 5px 0 0;">通过下方链接注册，首单满$40即返$40现金奖励！</p>
        </div>

        <a href="https://www.rakuten.ca/referrer?referrerid=J9l09BkJzsA%3D" target="_blank" class="btn btn-primary">第一步：点击领取 $40 奖励</a>

        <div class="step-list">
            <div class="step-item">
                <a href="guide_reg.html" target="_blank" class="inline-link">注册与收款设置：</a> 在 Settings 中绑定 <b>e-Transfer</b> 或 <b>PayPal</b>。
            </div>
            <div class="step-item">
                <strong>叠加 40% 折扣：</strong> 在 PetSmart 结账时务必勾选 <b>Autoship</b> 订阅。
            </div>
            <div class="step-item">
                <a href="guide_shop.html" target="_blank" class="inline-link">实测账单：</a> 通过本攻略，原价 $91 的宠粮最终到手仅需 <b>$29.31</b>。
            </div>
        </div>

        <a href="guide_shop.html" target="_blank" class="btn btn-orange">第二步：查看 PetSmart 购物套利详细指引</a>
        
        <a href="guide_reg.html" target="_blank" class="btn btn-blue">查看 Rakuten 图文注册教程</a>
        
        <p style="font-size: 0.8rem; color: #777; margin-top: 10px;">Tips: 建议关闭 AdBlock 插件以确保返现追踪成功。</p>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'zh-CN', includedLanguages: 'en,fr,zh-CN,zh-TW,pa,es,ar,tl,ko,vi', autoDisplay: false}, 'google_translate_element');
        }
        function changeLanguage(langCode) {
            const select = document.querySelector('.goog-te-combo');
            if (select) { select.value = langCode; select.dispatchEvent(new Event('change')); }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
